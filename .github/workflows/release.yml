name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMEBRIDGE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GAMEBRIDGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAMEBRIDGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAMEBRIDGE_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing signing secret for $v; refusing to publish an unsigned release."
              exit 1
            fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMEBRIDGE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          GAMEBRIDGE_SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          GAMEBRIDGE_SIGNING_STORE_PASSWORD: ${{ secrets.GAMEBRIDGE_KEYSTORE_PASSWORD }}
          GAMEBRIDGE_SIGNING_KEY_ALIAS: ${{ secrets.GAMEBRIDGE_KEY_ALIAS }}
          GAMEBRIDGE_SIGNING_KEY_PASSWORD: ${{ secrets.GAMEBRIDGE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk | head -5

      - name: Stage APK
        run: cp app/build/outputs/apk/release/app-release.apk "GameBridge-${GITHUB_REF_NAME}.apk"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "GameBridge-${GITHUB_REF_NAME}.apk" \
            --prerelease --generate-notes --verify-tag \
            --notes "Pre-release. See the [Storefront support table](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#support) for what is verified."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
